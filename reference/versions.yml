# db-triage — PostgreSQL and MySQL/MariaDB version data.
#
# WHAT THIS IS FOR. PG-REL-001 through PG-REL-004 are the only checks whose
# answer lives outside the database: whether the running major version is past
# end of life, is close to it, or is behind on minor releases. That information
# rots, so it is data with a date on it rather than logic in a query.
#
# XX-META-004 fires when `as_of` is more than 180 days old, and the REL checks
# drop to confidence: low when it does. That is deliberate: the tool is supposed
# to nag its own maintainers. XX-META-004 also fires when the running server
# reports a minor newer than anything recorded here, which is the other way this
# file announces its own staleness.
#
# HOW TO UPDATE. Take the EOL dates from
# https://www.postgresql.org/support/versioning/ and the latest minor releases
# from https://www.postgresql.org/support/security/ (which also lists the CVEs
# fixed in each). For MySQL use https://endoflife.date/mysql and Oracle's
# lifetime-support policy; for MariaDB use https://mariadb.org/about/#maintenance-policy
# or https://endoflife.date/mariadb. Then set `as_of` to today and run
# bin/build.py --check.
#
# VERIFY BEFORE TRUSTING. The values below were transcribed from the pages named
# above on `as_of`. They are not re-fetched at build time and nothing validates
# them against the vendors, so treat anything here as an assertion with a date
# on it rather than as ground truth.

schema_version: 1
as_of: 2026-09-02
verified_by: "fetched 2026-09-02 from postgresql.org/support/versioning, postgresql.org, endoflife.date/mysql and endoflife.date/mariadb"

postgresql:
  # PostgreSQL ships a minor release every quarter and supports each major for
  # five years from its initial release. `latest_minor` is the newest minor
  # known at `as_of`; a server two or more minors behind fires PG-REL-004.
  #
  # The 2026-08-13 release set (18.6, 17.11, 16.15, 15.19, 14.24) fixed 28
  # security vulnerabilities across the supported majors, so a server more than
  # one minor behind on any of them is missing security fixes, not just bugfixes.
  #
  # PostgreSQL 19 was at Beta 3 on `as_of` and is deliberately absent: a beta has
  # no EOL date and should not be compared against a latest_minor.
  eol_policy_url: https://www.postgresql.org/support/versioning/
  majors:
    11: {released: 2018-10-18, eol: 2023-11-09, latest_minor: "11.22", supported: false}
    12: {released: 2019-10-03, eol: 2024-11-21, latest_minor: "12.22", supported: false}
    13: {released: 2020-09-24, eol: 2025-11-13, latest_minor: "13.23", supported: false}
    14: {released: 2021-09-30, eol: 2026-11-12, latest_minor: "14.24", supported: true}
    15: {released: 2022-10-13, eol: 2027-11-11, latest_minor: "15.19", supported: true}
    16: {released: 2023-09-14, eol: 2028-11-09, latest_minor: "16.15", supported: true}
    17: {released: 2024-09-26, eol: 2029-11-08, latest_minor: "17.11", supported: true}
    18: {released: 2025-09-25, eol: 2030-11-14, latest_minor: "18.6",  supported: true}
  # Minor releases whose absence should escalate PG-REL-004 from "two behind" to
  # "one behind is enough". Add an entry when a minor fixes a remotely
  # exploitable CVE; leave the list empty rather than guessing. The 2026-08-13
  # set is not listed here because the per-CVE remote-exploitability detail was
  # not checked — that is a gap, not a statement that none qualify.
  cve_minors: []

mysql:
  # Oracle's LTS releases get five years of premier support then three of
  # extended; innovation releases are supported only until the next one ships,
  # which is roughly a quarter. An innovation release therefore goes EOL fast,
  # and catching that is most of the value of these rows.
  eol_policy_url: https://endoflife.date/mysql
  majors:
    "5.7":  {released: 2015-10-09, eol: 2023-10-31, latest_minor: "5.7.44", supported: false}
    "8.0":  {released: 2018-04-08, eol: 2026-04-30, latest_minor: "8.0.46", supported: false, lts: true}
    "8.4":  {released: 2024-04-10, eol: 2032-04-30, latest_minor: "8.4.11", supported: true, lts: true}
    "9.0":  {released: 2024-06-07, eol: 2024-10-15, latest_minor: "9.0.1",  supported: false, innovation: true}
    "9.1":  {released: 2024-09-24, eol: 2025-01-21, latest_minor: "9.1.2",  supported: false, innovation: true}
    "9.2":  {released: 2024-12-15, eol: 2025-04-15, latest_minor: "9.2.2",  supported: false, innovation: true}
    "9.3":  {released: 2025-03-31, eol: 2025-07-22, latest_minor: "9.3.2",  supported: false, innovation: true}
    "9.4":  {released: 2025-07-09, eol: 2025-10-21, latest_minor: "9.4.2",  supported: false, innovation: true}
    "9.5":  {released: 2025-10-21, eol: 2026-01-20, latest_minor: "9.5.2",  supported: false, innovation: true}
    "9.6":  {released: 2026-01-20, eol: 2026-04-21, latest_minor: "9.6.1",  supported: false, innovation: true}
    "9.7":  {released: 2026-04-21, eol: 2034-04-21, latest_minor: "9.7.2",  supported: true, lts: true}
  cve_minors: []

mariadb:
  # MariaDB's LTS series get five years; every other series is supported only
  # until the next one ships, about a quarter later. Only the LTS lines and the
  # most recent short-term series are worth carrying here.
  eol_policy_url: https://mariadb.org/about/#maintenance-policy
  majors:
    "10.5":  {released: 2020-06-24, eol: 2025-06-24, latest_minor: "10.5.29", supported: false, lts: true}
    "10.6":  {released: 2021-07-06, eol: 2026-07-06, latest_minor: "10.6.28", supported: false, lts: true}
    "10.11": {released: 2023-02-16, eol: 2028-02-16, latest_minor: "10.11.19", supported: true, lts: true}
    "11.4":  {released: 2024-05-29, eol: 2029-05-29, latest_minor: "11.4.13", supported: true, lts: true}
    "11.8":  {released: 2025-06-04, eol: 2028-06-04, latest_minor: "11.8.9",  supported: true, lts: true}
    "12.3":  {released: 2026-05-28, eol: 2029-06-12, latest_minor: "12.3.3",  supported: true, lts: true}
  cve_minors: []
